<section class="panel state" role="status">
  <div class="state__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M4 20h16" />
      <path d="M6 20V6h7v14" />
      <path d="M13 10h5v10" />
      <path d="M8.5 9h2" />
      <path d="M8.5 12.5h2" />
      <path d="M8.5 16h2" />
    </svg>
  </div>
  @if (filtersActive()) {
    <h2 class="state__title">{{ 'empty.filteredHeading' | translate }}</h2>
    <p class="state__text">{{ 'empty.filteredMessage' | translate }}</p>
    <button type="button" class="button button--ghost" (click)="clearFilters.emit()">
      {{ 'empty.clearFilters' | translate }}
    </button>
  } @else {
    <h2 class="state__title">{{ 'empty.heading' | translate }}</h2>
    <p class="state__text">{{ 'empty.message' | translate }}</p>
  }
</section>
